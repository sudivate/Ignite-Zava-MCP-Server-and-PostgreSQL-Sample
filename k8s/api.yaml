apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: zava-shop
  labels:
    app: api
    component: api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        component: api-server
        azure.workload.identity/use: "true"
      annotations:
        instrumentation.opentelemetry.io/private-preview-inject-python: "default"
    spec:
      serviceAccountName: zava-shop-sa
      containers:
      - name: api
        image: zavashopacr13487.azurecr.io/zava-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: UVICORN_PORT
          value: "8000"
        - name: DEV_GUEST_TOKEN
          valueFrom:
            secretKeyRef:
              name: zava-secrets
              key: DEV_GUEST_TOKEN
        - name: DEMO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: zava-secrets
              key: DEMO_PASSWORD
        - name: FINANCE_MCP_HTTP
          value: "http://finance-mcp-service:8002"
        - name: SUPPLIER_MCP_HTTP
          value: "http://supplier-mcp-service:8002"
        - name: AZURE_OPENAI_ENDPOINT_GPT5
          valueFrom:
            secretKeyRef:
              name: zava-secrets
              key: AZURE_OPENAI_ENDPOINT_GPT5
        - name: AZURE_CLIENT_ID
          value: "77ba61d8-0ec8-494b-951f-935f49c400b9"
        - name: AZURE_OPENAI_MODEL_DEPLOYMENT_NAME_GPT5
          valueFrom:
            secretKeyRef:
              name: zava-secrets
              key: AZURE_OPENAI_MODEL_DEPLOYMENT_NAME_GPT5
        - name: AZURE_OPENAI_ENDPOINT_VERSION_GPT5
          valueFrom:
            configMapKeyRef:
              name: zava-config
              key: AZURE_OPENAI_ENDPOINT_VERSION_GPT5
        - name: AZURE_AI_PROJECT_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: zava-config
              key: AZURE_AI_PROJECT_ENDPOINT
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: zava-secrets
              key: APPLICATIONINSIGHTS_CONNECTION_STRING
        - name: OTEL_PYTHON_EXCLUDED_URLS
          valueFrom:
            configMapKeyRef:
              name: zava-config
              key: OTEL_PYTHON_EXCLUDED_URLS
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: zava-shop
  labels:
    app: api
    component: api-server
spec:
  selector:
    app: api
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP